<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtual House Tour — 360°</title>
  <meta name="description" content="Explore the home in an immersive 360° virtual tour." />
  <meta property="og:title" content="Virtual House Tour — 360°" />
  <meta property="og:description" content="Explore the home in an immersive 360° virtual tour." />
  <meta property="og:type" content="website" />

  <!-- Pannellum -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --black: #000000;
      --emerald: #34d399;
      --glass-bg: rgba(0,0,0,0.45);
      --glass-border: rgba(255,255,255,0.10);
      --glass-hover: rgba(255,255,255,0.15);
      --text-muted: rgba(255,255,255,0.60);
      --text-dim: rgba(255,255,255,0.40);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'DM Sans', sans-serif;
      color: var(--white);
    }

    /* ── Pannellum container ── */
    #pnlm-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    .pnlm-container { background: #000 !important; }

    /* ── Loading veil ── */
    #loading-veil {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      flex-direction: column;
      gap: 1.25rem;
      transition: opacity 0.7s ease;
    }
    #loading-veil.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Transition veil ── */
    #transition-veil {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
    }
    #transition-veil.active { opacity: 0.60; }

    /* ── Top header ── */
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .brand-text { line-height: 1.25; }
    .brand-sub {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--text-muted);
    }
    .brand-name {
      font-size: 14px;
      font-weight: 500;
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 0.04em;
    }
    .controls { display: flex; align-items: center; gap: 0.5rem; }
    .live-badge {
      display: none;
      align-items: center;
      gap: 0.5rem;
      padding: 6px 12px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    @media (min-width: 640px) { .live-badge { display: inline-flex; } }
    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--emerald);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 1; } 50% { opacity: 0.4; }
    }
    .btn-rotate {
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      background: rgba(255,255,255,0.08);
      color: var(--white);
    }
    .btn-rotate:hover { background: var(--glass-hover); }
    .btn-rotate.active { background: var(--white); color: #000; border-color: var(--white); }

    /* ── Room badge ── */
    #room-badge {
      position: fixed;
      top: 80px; left: 1rem;
      z-index: 20;
    }
    @media (min-width: 640px) { #room-badge { top: 96px; left: 1.5rem; } }
    .badge-inner {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 10px 16px;
      border-radius: 9999px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .badge-counter {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--text-muted);
    }
    .badge-divider {
      width: 1px; height: 12px;
      background: rgba(255,255,255,0.20);
    }
    .badge-room {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-family: 'Cormorant Garamond', serif;
    }

    /* ── Hint ── */
    #hint {
      position: fixed;
      bottom: 140px; left: 50%; transform: translateX(-50%);
      z-index: 10;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }
    @media (min-width: 640px) { #hint { bottom: 148px; } }

    /* ── Thumbnail nav ── */
    #thumb-nav {
      position: fixed;
      bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 8px;
      padding: 8px;
      border-radius: 16px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      max-width: calc(100vw - 1.5rem);
      overflow-x: auto;
    }
    .thumb-btn {
      position: relative;
      flex-shrink: 0;
      width: 112px; height: 72px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: none;
      padding: 0;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
      opacity: 0.75;
    }
    .thumb-btn:hover { opacity: 1; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.40); }
    .thumb-btn.active { opacity: 1; box-shadow: inset 0 0 0 2px var(--white); }
    .thumb-btn img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.20) 60%, transparent 100%);
    }
    .thumb-label {
      position: absolute;
      bottom: 4px; left: 8px; right: 8px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--white);
      text-align: left;
    }
    .thumb-active-dot {
      position: absolute;
      top: 6px; right: 6px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--white);
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
      display: none;
    }
    .thumb-btn.active .thumb-active-dot { display: block; }

    /* ── Hotspots ── */
    .tour-hotspot {
      height: 64px; width: 64px;
      background: transparent;
      margin-left: -32px;
      margin-top: -32px;
    }
    .tour-hotspot-inner {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 56px; width: 56px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.95);
      color: #111;
      font-size: 22px;
      font-weight: 600;
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
      animation: tour-pulse 2.4s ease-in-out infinite;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .tour-hotspot-inner::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.35);
    }
    .tour-hotspot:hover .tour-hotspot-inner {
      transform: scale(1.08);
      background: #fff;
    }
    .tour-hotspot-label {
      position: absolute;
      top: 68px; left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      padding: 5px 12px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.10);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      font-family: 'DM Sans', sans-serif;
    }
    .tour-hotspot:hover .tour-hotspot-label {
      opacity: 1;
      transform: translateX(-50%) translateY(2px);
    }
    @keyframes tour-pulse {
      0%,100% { box-shadow: 0 8px 28px rgba(0,0,0,0.45), 0 0 0 0 rgba(255,255,255,0.45); }
      50%      { box-shadow: 0 8px 28px rgba(0,0,0,0.45), 0 0 0 16px rgba(255,255,255,0); }
    }
  </style>
</head>
<body>

  <!-- Pannellum mount -->
  <div id="pnlm-container"></div>

  <!-- Loading veil -->
  <div id="loading-veil">
    <div class="spinner"></div>
    <p class="loading-label">Preparing your tour</p>
  </div>

  <!-- Transition veil -->
  <div id="transition-veil"></div>

  <!-- Top bar -->
  <header id="top-bar">
    <div class="brand">
      <div class="brand-icon">VT</div>
      <div class="brand-text">
        <p class="brand-sub">Virtual Tour</p>
        <p class="brand-name">Private Residence</p>
      </div>
    </div>
    <div class="controls">
      <span class="live-badge">
        <span class="live-dot"></span>
        Live 360°
      </span>
      <button id="btn-rotate" class="btn-rotate">Auto-rotate</button>
    </div>
  </header>

  <!-- Room badge -->
  <div id="room-badge">
    <div class="badge-inner">
      <span class="badge-counter" id="badge-counter">01 / 02</span>
      <span class="badge-divider"></span>
      <span class="badge-room" id="badge-room">Living Room</span>
    </div>
  </div>

  <!-- Hint -->
  <p id="hint">Drag to look around · Click <span style="color:rgba(255,255,255,0.8)">→</span> to walk through</p>

  <!-- Thumbnail nav -->
  <nav id="thumb-nav"></nav>

  <!-- Pannellum JS -->
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // ROOM DATA
    // ─────────────────────────────────────────────────────────────────────────
    // ⚠️  Replace the `image` URLs below with the paths to YOUR actual
    //     equirectangular panorama files.  If you deploy to GitHub Pages,
    //     put living.jpeg and kitchen.jpeg in the same folder as index.html
    //     and just use: image: "living.jpeg"
    // ─────────────────────────────────────────────────────────────────────────
    const rooms = [
      {
        id: "living",
        name: "Living Room",
        // Replace with your actual image path, e.g. "living.jpeg"
        image: "src/assets/living.jpeg",
        // Thumbnail — can be same image or a cropped preview
        thumb: "src/assets/living.jpeg",
        exits: {
          kitchen: { to: "kitchen", yaw: 60, pitch: -5 }
        }
      },
      {
        id: "kitchen",
        name: "Kitchen & Dining",
        image: "src/assets/kitchen.jpeg",
        thumb: "src/assets/kitchen.jpeg",
        exits: {
          living: { to: "living", yaw: -60, pitch: -5 }
        }
      }
    ];

    // ── State ──────────────────────────────────────────────────────────────
    let viewer = null;
    let autoRotate = false;
    let transitioning = false;
    let currentRoom = "living";

    // ── Build hotspot list for a room ──────────────────────────────────────
    function buildHotspots(roomId) {
      const room = rooms.find(r => r.id === roomId);
      return Object.values(room.exits).map(exit => ({
        pitch: exit.pitch,
        yaw: exit.yaw,
        type: "scene",
        sceneId: exit.to,
        clickHandlerFunc: (_e, args) => walkTo(args.to),
        clickHandlerArgs: { to: exit.to },
        cssClass: "tour-hotspot",
        createTooltipFunc: makeHotspot,
        createTooltipArgs: rooms.find(r => r.id === exit.to).name
      }));
    }

    // ── Create hotspot DOM ─────────────────────────────────────────────────
    function makeHotspot(div, label) {
      const inner = document.createElement("div");
      inner.className = "tour-hotspot-inner";
      inner.innerHTML = "→";
      const tip = document.createElement("span");
      tip.className = "tour-hotspot-label";
      tip.textContent = "Enter " + label;
      inner.appendChild(tip);
      div.appendChild(inner);
    }

    // ── Build thumbnail nav ────────────────────────────────────────────────
    function buildThumbs() {
      const nav = document.getElementById("thumb-nav");
      nav.innerHTML = "";
      rooms.forEach(room => {
        const btn = document.createElement("button");
        btn.className = "thumb-btn" + (room.id === currentRoom ? " active" : "");
        btn.dataset.id = room.id;
        btn.innerHTML = `
          <img src="${room.thumb}" alt="${room.name}" onerror="this.style.background='#1a1a1a'"/>
          <span class="thumb-overlay"></span>
          <span class="thumb-label">${room.name}</span>
          <span class="thumb-active-dot"></span>
        `;
        btn.addEventListener("click", () => walkTo(room.id));
        nav.appendChild(btn);
      });
    }

    // ── Update UI for current room ─────────────────────────────────────────
    function updateRoomUI(roomId) {
      currentRoom = roomId;
      const idx = rooms.findIndex(r => r.id === roomId) + 1;
      const name = rooms.find(r => r.id === roomId).name;
      document.getElementById("badge-counter").textContent =
        String(idx).padStart(2,"0") + " / " + String(rooms.length).padStart(2,"0");
      document.getElementById("badge-room").textContent = name;
      document.querySelectorAll(".thumb-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.id === roomId);
      });
    }

    // ── Smooth walk transition ─────────────────────────────────────────────
    function walkTo(targetId) {
      if (!viewer || transitioning) return;
      const fromId = viewer.getScene();
      if (fromId === targetId) return;

      const fromRoom = rooms.find(r => r.id === fromId);
      const targetRoom = rooms.find(r => r.id === targetId);
      const exit = fromRoom?.exits[targetId];
      const back = targetRoom?.exits[fromId];

      transitioning = true;
      document.getElementById("transition-veil").classList.add("active");
      try { viewer.stopAutoRotate(); } catch {}

      const aimYaw = exit ? exit.yaw : viewer.getYaw();
      const aimPitch = exit ? exit.pitch : 0;

      try { viewer.lookAt(aimPitch, aimYaw, 95, 650); } catch {}

      setTimeout(() => {
        try { viewer.lookAt(aimPitch, aimYaw, 55, 550); } catch {}
      }, 680);

      setTimeout(() => {
        const entryYaw = back ? back.yaw + 180 : aimYaw;
        try { viewer.loadScene(targetId, 0, entryYaw, 65); } catch {}
        updateRoomUI(targetId);
        setTimeout(() => {
          try { viewer.lookAt(0, entryYaw, 100, 900); } catch {}
        }, 260);
        setTimeout(() => {
          transitioning = false;
          document.getElementById("transition-veil").classList.remove("active");
          if (autoRotate) try { viewer.startAutoRotate(-2); } catch {}
        }, 1400);
      }, 1180);
    }

    // ── Auto-rotate toggle ─────────────────────────────────────────────────
    document.getElementById("btn-rotate").addEventListener("click", () => {
      autoRotate = !autoRotate;
      const btn = document.getElementById("btn-rotate");
      btn.textContent = autoRotate ? "Pause" : "Auto-rotate";
      btn.classList.toggle("active", autoRotate);
      if (!viewer) return;
      try {
        if (autoRotate) viewer.startAutoRotate(-2);
        else viewer.stopAutoRotate();
      } catch {}
    });

    // ── Init viewer ────────────────────────────────────────────────────────
    function initViewer() {
      const sceneConfig = {};
      rooms.forEach(r => {
        sceneConfig[r.id] = {
          type: "equirectangular",
          panorama: r.image,
          pitch: 0, yaw: 0, hfov: 100,
          hotSpots: buildHotspots(r.id)
        };
      });

      viewer = pannellum.viewer("pnlm-container", {
        default: {
          firstScene: "living",
          sceneFadeDuration: 1200,
          autoLoad: true,
          showControls: false,
          showFullscreenCtrl: false,
          showZoomCtrl: false,
          keyboardZoom: true,
          mouseZoom: true,
          draggable: true,
          hfov: 100,
          minHfov: 50,
          maxHfov: 120,
          compass: false,
          friction: 0.18
        },
        scenes: sceneConfig
      });

      viewer.on("load", () => {
        const veil = document.getElementById("loading-veil");
        veil.classList.add("hidden");
        setTimeout(() => veil.style.display = "none", 700);
      });

      viewer.on("scenechange", id => updateRoomUI(id));
    }

    // ── Bootstrap ─────────────────────────────────────────────────────────
    buildThumbs();
    initViewer();
  </script>
</body>
</html>
